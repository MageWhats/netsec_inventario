<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Net&amp;Sec Inventario</title>
    <meta name="description" content="Inventario de Net&amp;Sec Suministros" />

    <link rel="icon" type="image/svg+xml" href="/brand/simbolo.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- App instalada en el teléfono: pantalla completa y barra de estado del color de la app -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Net&amp;Sec" />
  </head>
  <body>
    <!--
      Mientras carga la app instalada: el símbolo en el mismo sitio que la pantalla de inicio del sistema y que
      el inicio de la animación (SplashScreen.tsx), para que no se note el salto. React lo reemplaza al arrancar.
    -->
    <style>
      #carga-inicial {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b0f19;
      }
      #carga-inicial img {
        width: 8rem;
        height: 8rem;
        filter: drop-shadow(0 0 30px rgba(0, 180, 240, 0.45));
      }
      @media (min-width: 640px) {
        #carga-inicial img {
          width: 10rem;
          height: 10rem;
        }
      }
      @media (display-mode: standalone) {
        #carga-inicial {
          display: flex;
        }
      }
    </style>
    <div id="root">
      <div id="carga-inicial"><img src="/brand/simbolo.svg" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
